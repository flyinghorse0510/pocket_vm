# Unprivileged guest networking. UML's vector driver reaches an AF_UNIX socket
# through its bess transport; slirp4netns serves that socket and does the NAT
# in userspace, so a guest reaches the network with no TUN device, no
# CAP_NET_ADMIN and no host configuration. It is built statically from source
# because a sealed profile artifact may not depend on the host's libraries;
# glib is libslirp's own mandatory dependency and drags pcre2, libffi and zlib.
[zlib]
version = "1.3.1"
tarball_url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
tarball_sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"

