# EXPERIMENTAL, opt-in kernel variant for hosts whose kernel and C library
# predate what UML's seccomp backend assumes. Nothing below is used unless the
# operator sets POCKET_KERNEL_VARIANT=el7 (or runs `make kernel-el7`); the
# default build never reads this section and its output is unaffected.
#
# The overlay applies on top of the default patch series -- base_tree_sha1
# here is exactly the default series' patched_tree_sha1 above, so the two locks
# are a chain rather than two independent claims about the same tree.
#
# The artifact digests are toolchain-bound, as the default build's are. They
# were produced on the reference host recorded below; a different compiler or
# linker changes the bytes and fails the build closed rather than silently
# shipping something else.
[linux.variant.el7]
description = "CentOS 7 / EL7-vintage hosts: kernels without close_range or execveat, and glibc 2.17"
